services:
  mysql:
    image: ${MYSQL_IMAGE:-public.ecr.aws/docker/library/mysql:8.4}
    container_name: smes-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Set MYSQL_DATABASE in .env}
      MYSQL_USER: ${MYSQL_USER:?Set MYSQL_USER in .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - smes-mysql-v2-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\""]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks:
      - backend

  redis:
    image: redis:7.4-alpine
    container_name: smes-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    command:
      - sh
      - -c
      - exec redis-server --appendonly yes --requirepass "$${REDIS_PASSWORD}"
    volumes:
      - smes-redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    networks:
      - backend

  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    container_name: smes-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?Set RABBITMQ_USER in .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:?Set RABBITMQ_VHOST in .env}
    volumes:
      - smes-rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    networks:
      - backend

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smes-api
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      TZ: Asia/Shanghai
      ConnectionStrings__Default: "Server=mysql;Port=3306;Database=${MYSQL_DATABASE:?Set MYSQL_DATABASE in .env};User=${MYSQL_USER:?Set MYSQL_USER in .env};Password=${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env};CharSet=utf8mb4;AllowPublicKeyRetrieval=true;SslMode=None"
      Jwt__Secret: ${JWT_SECRET:?Set JWT_SECRET in .env}
      Altcha__HmacSignatureSecret: ${ALTCHA_HMAC_SIGNATURE_SECRET:?Set ALTCHA_HMAC_SIGNATURE_SECRET in .env}
      Altcha__HmacKeySignatureSecret: ${ALTCHA_HMAC_KEY_SIGNATURE_SECRET:?Set ALTCHA_HMAC_KEY_SIGNATURE_SECRET in .env}
      Jwt__Issuer: smes
      Jwt__Audience: smes-web
      Redis__Configuration: "redis:6379,password=${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}"
      RabbitMq__Host: rabbitmq
      RabbitMq__Port: "5672"
      RabbitMq__UserName: ${RABBITMQ_USER:?Set RABBITMQ_USER in .env}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
      RabbitMq__VirtualHost: ${RABBITMQ_VHOST:?Set RABBITMQ_VHOST in .env}
      Seed__DemoEnabled: ${SEED_DEMO_ENABLED:-false}
      Seed__IndustryScenariosEnabled: ${SEED_INDUSTRY_SCENARIOS_ENABLED:-false}
      Seed__AdminPassword: ${SEED_ADMIN_PASSWORD:-}
      Seed__DemoUserPassword: ${SEED_DEMO_USER_PASSWORD:-}
      Seed__ScenarioPassword: ${SEED_SCENARIO_PASSWORD:-}
      AllowedOrigins__0: ${ALLOWED_ORIGINS:?Set ALLOWED_ORIGINS in .env}
    networks:
      - backend
      - web

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-public.ecr.aws/docker/library/node:22-alpine}
        NGINX_IMAGE: ${NGINX_IMAGE:-public.ecr.aws/docker/library/nginx:stable-alpine}
    container_name: smes-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-8088}:80"
    networks:
      - web

volumes:
  smes-mysql-v2-data:
  smes-redis-data:
  smes-rabbitmq-data:

networks:
  backend:
    internal: true
  web:
